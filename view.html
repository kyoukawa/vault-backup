<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库</title>
<link rel="stylesheet" href="assets/hermes.css">
<script src="assets/marked.min.js"></script>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script defer src="assets/katex/katex.min.js"></script>

<script src="assets/theme.js" defer></script>
</head>
<body>
<div class="crumb"><a href="index.html">首页</a> / <span id="title">加载中…</span></div>
<div id="err"></div>
<article id="md"></article>
<script>
function resolveWikilink(raw){
  let t=raw.trim().replace(/^[#!]+/,'').split('#')[0].trim();
  if(!t) return null;
  let keys=[t, t.endsWith('.md')?t:t+'.md', './'+t, '/'+t];
  for(const k of keys){ if(linkmap[k]) return linkmap[k]; }
  const base=t.split('/').pop();
  for(const k in linkmap){ if(k.split('/').pop()===base || k.split('/').pop()===base+'.md') return linkmap[k]; }
  // ids.json 回退：按文件名 basename 找完整路径（新笔记可能未在 linkmap 中）
  if(window.idmap){
    for(const [id,full] of Object.entries(window.idmap)){
      if(full.split('/').pop()===base || full.split('/').pop()===base+'.md') return full;
    }
  }
  return t.endsWith('.md')?t:t+'.md';
}
function idForPath(p){
  // 真实路径 -> 英文 ID（优先短 ID），没有则返回原路径（兼容）
  if(!window.idmap) return p;
  for(const [id,path] of Object.entries(window.idmap)){ if(path===p) return id; }
  return p;
}
function mdLink(href,label){ return '<a href="view.html?file='+encodeURIComponent(idForPath(href))+'">'+label+'</a>'; }
function convertChem(s){
  // 化学离子/分子式：Fe3+ -> $\mathrm{Fe}^{3+}$；跳过 ______ 填空；Unicode 上下标保留
  // 仅转换「元素符号+数字+正负」这种紧凑式，避免误伤普通文本
  s=s.replace(/\\_/g,'__KATEXESC__');
  s=s.replace(/(\b[A-Z][a-z]?)(\d+)([+-])/g,(m,el,n,sg)=>'$\\mathrm{'+el+'}^{'+n+sg+'}$');
  s=s.replace(/(\b[A-Z][a-z]?)(\d+)(?=[^\\w\\d]|$)/g,(m,el,n)=>'$\\mathrm{'+el+'}_'+n+'$');
  s=s.replace(/__KATEXESC__/g,'\\_');
  return s;
}
function convertObsidian(text){
  // ---- 1. Obsidian callouts -> collapsible boxes (must run before wikilinks) ----
  // match a run of '> [!type] title' / '> [!type]- title' lines with their '> ...' body,
  // optionally preceded/followed by blank quoted lines.
  text=text.replace(/(^|\n)(> \[!(\w+)\]([-+])?[^\n]*\n(?:>[^\n]*\n)*)/g,(m,pre,block,type,fold)=>{
    const lines=block.split('\n').filter(l=>l.startsWith('>'));
    const head=lines[0].replace(/^>\s*/,'');
    const kind=head.replace(/^\[!\w+\]([-+])?\s*/,'').trim()|| ({question:'题目',success:'参考答案',note:'笔记',tip:'提示',warning:'注意'}[type]||type);
    const body=lines.slice(1).map(l=>l.replace(/^>\s?/,'')).join('\n').replace(/\n{2,}/g,'\n\n').trim();
    // (chem conversion applied globally below instead)
    const cls=(type==='question')?'q':(type==='success')?'a':'n';
    const open=(type==='question'||fold==='+' || (type!=='question'&&type!=='success'))?' open':'';
    return pre+'<details class="callout '+cls+'"'+open+'><summary>'+kind+'</summary><div class="callout-body">'+marked.parse(body)+'</div></details>\n';
  });
  // ---- 2. [[target|label]] and [[target]] ----
  text=text.replace(/\[\[([^\]\n]+?)\]\]/g,(m,inner)=>{
    let parts=inner.split('|');
    let target=parts[0].replace(/\\/g,'').trim();
    let label=(parts[1]||parts[0]).replace(/\\/g,'').trim();
    let href=resolveWikilink(target);
    return href?mdLink(href,label):label;
  });
  // ---- 3. ![[file.png]] ----
  text=text.replace(/!\[\[([^\]\n]+?)\]\]/g,(m,f)=>'<img alt="'+f+'" src="'+encodeURIComponent(f)+'">');
  return text;
}
function renderMath(root){
  function go(){
    if(!window.katex) return setTimeout(go,100);
    root.querySelectorAll(':not(script):not(style)').forEach(()=>{});
    // text nodes: find $...$ segments and render
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[]; let n;
    while((n=walker.nextNode())) nodes.push(n);
    nodes.forEach(node=>{
      const txt=node.nodeValue;
      if(!txt || txt.indexOf('$')<0) return;
      const frag=document.createDocumentFragment();
      let i=0, re=/\$([^$]+?)\$/g, m, last=0;
      while((m=re.exec(txt))){
        if(m.index>last) frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        try{ const span=document.createElement('span'); katex.render(m[1],span,{throwOnError:false,displayMode:false}); frag.appendChild(span); }
        catch(e){ frag.appendChild(document.createTextNode(m[0])); }
        last=m.index+m[0].length;
      }
      if(last<txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      if(last>0) node.parentNode.replaceChild(frag,node);
    });
  }
  go();
}
async function main(){
  const params=new URLSearchParams(location.search);
  const file=params.get('file');
  if(!file){ document.getElementById('err').innerHTML='缺少 file 参数'; return; }
  try{
    // 支持纯英文 ID：?file=cold-studies 等；同时兼容原中文路径
    let idmap={};
    try{ idmap=await fetch('assets/ids.json?v='+Date.now()).then(r=>r.json()); window.idmap=idmap; }catch(e){}
    let resolved=idmap[file]||file;
    const lm=await fetch('assets/linkmap.json?v='+Date.now()).then(r=>r.json());
    window.linkmap=lm;
    let path=lm[resolved]||resolved;
    const resp=await fetch(encodeURI(path).replace(/%2F/g,'/'));
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    let text=await resp.text();

    // JSON 数据文件：直接展示结构，不当 Markdown 解析
    if(/\.json$/i.test(path)){
      document.title=(path.split('/').pop()||'数据')+' · 知识库';
      document.getElementById('title').textContent=path;
      let obj; try{ obj=JSON.parse(text); }catch(e){ throw new Error('JSON 解析失败: '+e.message); }
      const mdEl=document.getElementById('md');
      mdEl.innerHTML='<p class="sub">原始数据文件，共 '+Object.keys(obj).length+' 个顶层字段。</p>'
        + '<pre><code></code></pre>';
      mdEl.querySelector('code').textContent=JSON.stringify(obj,null,2);
      return;
    }

    document.title=(path.split('/').pop()||'知识库')+' · 知识库';
    document.getElementById('title').textContent=path;
    if(text.startsWith('---')){ let e=text.indexOf('\n---'); if(e>0) text=text.slice(e+4); }
    const converted=convertObsidian(text);
    const html=marked.parse(converted);
    const mdEl=document.getElementById('md');
    mdEl.innerHTML=html;
    // 移动端：所有 Markdown 表格包一层可横向滚动的容器，避免窄屏竖排表头
    mdEl.querySelectorAll('table').forEach(t=>{
      const wrap=document.createElement('div');
      wrap.className='table-wrap';
      t.parentNode.insertBefore(wrap,t);
      wrap.appendChild(t);
      // 窄屏提示：只有真的滑不动才不显示，避免误导
      const hint=document.createElement('div');
      hint.className='table-hint';
      hint.textContent='← 左右滑动查看完整表格 →';
      wrap.parentNode.insertBefore(hint,wrap.nextSibling);
    });
    renderMath(mdEl);
    // re-open any <details> that marked may have wrapped in <p> (none expected), no-op safeguard
  }catch(e){ document.getElementById('err').innerHTML='加载失败: '+e.message; }
}
main();
</script>
</body>
</html>
