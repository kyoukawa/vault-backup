<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库</title>
<link rel="stylesheet" href="assets/hermes.css">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/kb-ui.css">
<script src="assets/marked.min.js"></script>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script src="assets/katex/katex.min.js"></script>
<script src="assets/math-render.js"></script>
<script src="assets/theme.js" defer></script>
<script src="assets/kb-ui.js" defer></script>
<style>
  /* ---------- 三栏布局：目录 / 正文 / 大纲 ---------- */
  body { max-width: 1180px; }

  .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 2.4rem; }
  /* 窄屏：单列。必须写 minmax(0,1fr)，否则 grid 子项按内容撑开（auto 最小尺寸），
     长表格会把整页撑到 818px 宽 —— 实测踩过。 */
  @media (max-width: 880px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .layout > div { min-width: 0; }
  }

  /* 左侧目录 */
  aside.toc {
    position: sticky; top: 3.4rem; align-self: start;
    max-height: calc(100vh - 5rem); overflow-y: auto;
    padding-right: .5rem; font-size: .84rem;
    scrollbar-width: thin;
  }
  @media (max-width: 880px) { aside.toc { display: none; } }
  aside.toc .grp { margin-bottom: 1.1rem; }
  aside.toc .grp > b {
    display: block; font-size: .72rem; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); font-weight: 500;
    margin-bottom: .35rem;
  }
  aside.toc a {
    display: block; padding: .17rem .5rem; border-radius: 5px;
    color: var(--muted); text-decoration: none; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background-image: none;
  }
  aside.toc a:hover { background: var(--panel); color: var(--fg); }
  aside.toc a.cur { background: var(--accent-subtle); color: var(--accent-text); font-weight: 500; }

  /* 搜索面板：.kb-search / .kb-hits 由 assets/kb-ui.css 提供（全站同一套控件规格），
     这里不再重复定义 #q / .hits 的样式，避免两份圆角各改各的。 */
  .kbd {
    font-family: ui-monospace, monospace; font-size: .68rem; color: var(--dim);
    border: 1px solid var(--border); border-radius: 4px; padding: .08rem .32rem;
    white-space: nowrap;
  }

  /* 正文上的大纲（右浮动，靠 CSS 定位） */
  .outline { float: right; width: 170px; margin: 0 0 1rem 1.4rem;
             font-size: .78rem; position: sticky; top: 3.4rem; }
  .outline a { display: block; color: var(--dim); text-decoration: none;
               padding: .1rem 0; line-height: 1.4; background-image: none;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .outline a:hover { color: var(--accent); }
  .outline a.lv3 { padding-left: .8rem; }
  @media (max-width: 1080px) { .outline { display: none; } }

  /* 上一篇 / 下一篇 */
  .pager { display: flex; justify-content: space-between; gap: 1rem;
           margin: 3rem 0 0; padding-top: 1.2rem; border-top: 1px solid var(--border-muted); }
  .pager a { font-size: .86rem; color: var(--muted); text-decoration: none;
             background-image: none; max-width: 46%; }
  .pager a:hover { color: var(--accent); }
  .pager .nx { text-align: right; margin-left: auto; }
  .pager small { display: block; font-size: .72rem; color: var(--dim); }
</style>
</head>
<body>
<div class="crumb"><a href="index.html">首页</a> / <span id="title">加载中…</span></div>

<div data-kb-search></div>

<div class="layout">
  <aside class="toc" id="toc"></aside>
  <div>
    <div id="err"></div>
    <article id="md"></article>
    <nav class="pager" id="pager"></nav>
  </div>
</div>

<script>
// ---------- 全局状态 ----------
var IDMAP = {}, LINKMAP = {}, SEARCH = null, CUR_PATH = '';

function resolveWikilink(raw){
  let t=raw.trim().replace(/^[#!]+/,'').split('#')[0].trim();
  if(!t) return null;
  let keys=[t, t.endsWith('.md')?t:t+'.md', './'+t, '/'+t];
  for(const k of keys){ if(LINKMAP[k]) return LINKMAP[k]; }
  const base=t.split('/').pop();
  for(const k in LINKMAP){ if(k.split('/').pop()===base || k.split('/').pop()===base+'.md') return LINKMAP[k]; }
  if(window.idmap){
    for(const [id,full] of Object.entries(window.idmap)){
      if(full.split('/').pop()===base || full.split('/').pop()===base+'.md') return full;
    }
  }
  return t.endsWith('.md')?t:t+'.md';
}
function idForPath(p){
  if(!IDMAP) return p;
  for(const [id,path] of Object.entries(IDMAP)){ if(path===p) return id; }
  return p;
}
function mdLink(href,label){ return '<a href="view.html?file='+encodeURIComponent(idForPath(href))+'">'+label+'</a>'; }

function convertObsidian(text){
  text=text.replace(/(^|\n)(> \[!(\w+)\]([-+])?[^\n]*\n(?:>[^\n]*\n)*)/g,(m,pre,block,type,fold)=>{
    const lines=block.split('\n').filter(l=>l.startsWith('>'));
    const head=lines[0].replace(/^>\s*/,'');
    const kind=head.replace(/^\[!\w+\]([-+])?\s*/,'').trim()|| ({question:'题目',success:'参考答案',note:'笔记',tip:'提示',warning:'注意'}[type]||type);
    const body=lines.slice(1).map(l=>l.replace(/^>\s?/,'')).join('\n').replace(/\n{2,}/g,'\n\n').trim();
    const cls=(type==='question')?'q':(type==='success')?'a':'n';
    const open=(type==='question'||fold==='+' || (type!=='question'&&type!=='success'))?' open':'';
    return pre+'<details class="callout '+cls+'"'+open+'><summary>'+kind+'</summary><div class="callout-body">'+marked.parse(body)+'</div></details>\n';
  });
  text=text.replace(/\[\[([^\]\n]+?)\]\]/g,(m,inner)=>{
    let parts=inner.split('|');
    let target=parts[0].replace(/\\/g,'').trim();
    let label=(parts[1]||parts[0]).replace(/\\/g,'').trim();
    let href=resolveWikilink(target);
    return href?mdLink(href,label):label;
  });
  text=text.replace(/!\[\[([^\]\n]+?)\]\]/g,(m,f)=>'<img alt="'+f+'" src="'+encodeURIComponent(f)+'">');
  return text;
}

// ---------- 公式 ----------
// 实现放在 assets/math-render.js（view.html 与 latest.html 共用）：
// 先把 $…$ / $$…$$ 摘成占位符，marked 解析完再贴回 KaTeX。
// 直接对渲染后的 DOM 跑行内正则有两个坑：$$ 会被拆成 $+…+$，且 marked 会吃掉公式里的 _ *。



// ---------- 左侧目录 ----------
function buildToc(){
  const groups = {};
  Object.values(IDMAP).forEach(function(p){
    if(!p.endsWith('.md')) return;
    const parts = p.split('/');
    const top = parts.length > 1 ? parts[0] : '根目录';
    (groups[top] = groups[top] || []).push(p);
  });
  // 每个库只看它的 INDEX / 主导航 + 词条数
  const order = ['试卷库','语文语料库','英语语料库','化学错题本','学业档案','阅读收集','读书','数学','每日题目','根目录'];
  const keys = Object.keys(groups).sort(function(a,b){
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  const curLib = CUR_PATH.indexOf('/') > 0 ? CUR_PATH.split('/')[0] : '根目录';
  let html = '';
  keys.forEach(function(k){
    const isCur = (k === curLib);
    // 非当前库：只列个名字，点了跳到该库索引
    if(!isCur){
      const idxId = Object.keys(IDMAP).find(function(id){
        const p = IDMAP[id];
        return p.indexOf(k + '/INDEX') === 0 || p === k + '/INDEX.md';
      });
      html += '<div class="grp"><b>' + k + '</b>';
      if(idxId){
        html += '<a href="view.html?file=' + encodeURIComponent(idxId) + '">索引 · '
              + groups[k].length + ' 篇</a>';
      }
      html += '</div>';
      return;
    }
    // 当前库：展开同级文件
    html += '<div class="grp"><b>' + k + '</b>';
    const siblings = groups[k].slice().sort();
    siblings.slice(0, 30).forEach(function(p){
      const label = p.split('/').pop().replace(/\.md$/,'').slice(0, 22);
      const cur = p === CUR_PATH ? ' class="cur"' : '';
      html += '<a' + cur + ' href="view.html?file=' + encodeURIComponent(idForPath(p)) + '">'
            + label + '</a>';
    });
    if(siblings.length > 30){
      html += '<a style="color:var(--dim)" href="view.html?file='
            + encodeURIComponent('home') + '">…还有 ' + (siblings.length - 30) + ' 篇</a>';
    }
    html += '</div>';
  });
  document.getElementById('toc').innerHTML = html;
}

// ---------- 大纲（正文里加，靠 float 靠右） ----------
function buildOutline(mdEl){
  const hs = mdEl.querySelectorAll('h2, h3');
  if(hs.length < 3) return;
  let html = '<div class="outline">';
  hs.forEach(function(h, i){
    const id = 'h' + i;
    h.id = id;
    html += '<a class="' + (h.tagName === 'H3' ? 'lv3' : '') + '" href="#' + id + '">'
          + h.textContent.slice(0, 22) + '</a>';
  });
  html += '</div>';
  mdEl.insertAdjacentHTML('afterbegin', html);
}

// ---------- 上一篇 / 下一篇 ----------
function buildPager(path){
  // 同一目录下按路径排序取邻居（用 IDMAP 里的路径，不依赖搜索索引）
  const dir = path.split('/').slice(0,-1).join('/');
  const depth = path.split('/').length;
  const all = Object.keys(IDMAP).map(function(k){ return IDMAP[k]; })
    .filter(function(p){ return p && /\.md$/.test(p); });
  const same = Array.from(new Set(all)).filter(function(p){
    return p.indexOf(dir + '/') === 0 && p.split('/').length === depth;
  }).sort();
  const i = same.indexOf(path);
  if(i < 0) return;
  const prev = i > 0 ? {p: same[i-1], t: label(same[i-1])} : null;
  const next = i < same.length-1 ? {p: same[i+1], t: label(same[i+1])} : null;
  let html = '';
  if(prev) html += '<a href="view.html?file=' + encodeURIComponent(idForPath(prev.p)) + '">'
    + '<small>上一篇</small>' + esc(prev.t) + '</a>';
  if(next) html += '<a class="nx" href="view.html?file=' + encodeURIComponent(idForPath(next.p)) + '">'
    + '<small>下一篇</small>' + esc(next.t) + '</a>';
  document.getElementById('pager').innerHTML = html;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function label(p){ return p.split('/').pop().replace(/\.md$/,''); }

// ---------- 主流程 ----------
async function main(){
  const params=new URLSearchParams(location.search);
  const file=params.get('file');
  if(!file){ document.getElementById('err').innerHTML='缺少 file 参数'; return; }
  try{
    try{ IDMAP=await fetch('assets/ids.json?v='+Date.now()).then(r=>r.json()); window.idmap=IDMAP; }catch(e){}
    let resolved=IDMAP[file]||file;
    LINKMAP=await fetch('assets/linkmap.json?v='+Date.now()).then(r=>r.json());
    let path=LINKMAP[resolved]||resolved;
    CUR_PATH=path;

    const resp=await fetch(encodeURI(path).replace(/%2F/g,'/'));
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    let text=await resp.text();

    if(/\.json$/i.test(path)){
      document.title=(path.split('/').pop()||'数据')+' · 知识库';
      document.getElementById('title').textContent=path;
      let obj; try{ obj=JSON.parse(text); }catch(e){ throw new Error('JSON 解析失败: '+e.message); }
      const mdEl=document.getElementById('md');
      mdEl.innerHTML='<p class="sub">原始数据文件，共 '+Object.keys(obj).length+' 个顶层字段。</p><pre><code></code></pre>';
      mdEl.querySelector('code').textContent=JSON.stringify(obj,null,2);
      buildToc();
      return;
    }

    document.title=(path.split('/').pop()||'知识库')+' · 知识库';
    document.getElementById('title').textContent=path;
    if(text.startsWith('---')){ let e=text.indexOf('\n---'); if(e>0) text=text.slice(e+4); }
    const converted=convertObsidian(text);
    const math=kbMath.extract(converted);
    const html=marked.parse(math.text);
    const mdEl=document.getElementById('md');
    mdEl.innerHTML=html;

    mdEl.querySelectorAll('table').forEach(t=>{
      const wrap=document.createElement('div'); wrap.className='table-wrap';
      t.parentNode.insertBefore(wrap,t); wrap.appendChild(t);
      const hint=document.createElement('div'); hint.className='table-hint';
      hint.textContent='← 左右滑动查看完整表格 →';
      wrap.parentNode.insertBefore(hint,wrap.nextSibling);
    });
    kbMath.render(mdEl, math.store);
    buildOutline(mdEl);

    buildToc();
    // 搜索索引先加载，pager 才能用
    setTimeout(function(){ buildPager(path); }, 800);
    setTimeout(function(){ buildPager(path); }, 2500);
  }catch(e){ document.getElementById('err').innerHTML='加载失败: '+e.message; }
}
main();
</script>
</body>
</html>
