<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="margin:0;font:13px/1.5 monospace">
<iframe id="f" src="writing-ocr.html" style="width:390px;height:200px;border:1px solid red"></iframe>
<pre id="out"></pre>
<script>
document.getElementById('f').onload=function(){
  var d=this.contentDocument, w=this.contentWindow, L=[];
  L.push('innerWidth='+w.innerWidth);
  L.push('docScrollW='+d.documentElement.scrollWidth);
  var main=d.querySelector('#main'), wrap=d.querySelector('.wrap');
  L.push('mainW='+main.getBoundingClientRect().width.toFixed(1));
  L.push('wrapW='+wrap.getBoundingClientRect().width.toFixed(1)+' pad='+w.getComputedStyle(wrap).padding);
  var worst=null,ww=0;
  d.querySelectorAll('.chapter *').forEach(function(el){
    var r=el.getBoundingClientRect(); if(r.width>ww){ww=r.width;worst=el;}
  });
  L.push('最宽元素='+worst.tagName+'.'+(worst.className||'-')+' w='+ww.toFixed(1));
  var p=d.querySelector('.ch-body p');
  L.push('pW='+p.getBoundingClientRect().width.toFixed(1));
  document.getElementById('out').textContent=L.join('\n');
};
</script></body></html>
