<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<pre id="out">loading</pre>
<iframe id="f" src="writing-ocr.html" style="width:390px;height:800px;border:0"></iframe>
<script>
document.getElementById('f').onload=function(){
  var d=this.contentDocument, w=this.contentWindow;
  var lines=[];
  lines.push('innerWidth='+w.innerWidth);
  lines.push('doc.scrollWidth='+d.documentElement.scrollWidth);
  lines.push('body.scrollWidth='+d.body.scrollWidth);
  ['#layout','#sidebar','#main','.wrap','.chapter','.ch-body'].forEach(function(s){
    var el=d.querySelector(s); if(!el) return;
    var r=el.getBoundingClientRect();
    var cs=w.getComputedStyle(el);
    lines.push(s+': x='+r.x.toFixed(0)+' w='+r.width.toFixed(0)+' pos='+cs.position+' flex='+cs.flex+' padding='+cs.padding);
  });
  document.getElementById('out').textContent=lines.join('\n');
};
</script></body></html>
