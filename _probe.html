<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="writing-ocr.html" style="width:390px;height:844px;border:0"></iframe>
<div id="out"></div>
<script>
document.getElementById('f').onload=function(){
  var d=this.contentDocument, w=this.contentWindow;
  var L=[];
  L.push('innerWidth='+w.innerWidth);
  L.push('docScrollW='+d.documentElement.scrollWidth+' bodyScrollW='+d.body.scrollWidth);
  var main=d.querySelector('#main'), wrap=d.querySelector('.wrap');
  L.push('mainW='+main.getBoundingClientRect().width.toFixed(1)+' mainPad='+w.getComputedStyle(main).padding);
  L.push('wrapW='+wrap.getBoundingClientRect().width.toFixed(1)+' wrapPad='+w.getComputedStyle(wrap).padding);
  var worst=null,ww=0;
  d.querySelectorAll('#p001 *').forEach(function(el){var r=el.getBoundingClientRect(); if(r.right>ww){ww=r.right;worst=el;}});
  L.push('widest='+worst.tagName+'.'+(worst.className||'')+' right='+ww.toFixed(1));
  var p=d.querySelector('#p001 .ch-body p');
  var r=p.getBoundingClientRect();
  L.push('pW='+r.width.toFixed(1)+' pX='+r.x.toFixed(1)+' justify='+w.getComputedStyle(p).textAlign);
  document.getElementById('out').setAttribute('data-r', L.join(' | '));
  document.title=L.join(' | ');
};
</script></body></html>
